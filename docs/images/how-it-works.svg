<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none">
  <title>Goggles to Raspberry Pi 4 over USB-C, Pi 4 to an HDMI screen, phone or laptop on the Pi's Wi-Fi for the web console</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#4fd1c5"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="398" rx="24" fill="#0c0f14" stroke="#1f2733" stroke-width="2"/>

  <!-- goggles -->
  <rect x="50" y="50" width="250" height="190" rx="18" fill="#11151d" stroke="#1f2733" stroke-width="2"/>
  <g transform="translate(127 58) scale(1.5)" stroke="#4fd1c5" stroke-width="3">
    <path d="M19 30H45A11 11 0 0 1 45 52H38.5L35.6 47.2A4 4 0 0 0 28.4 47.2L25.5 52H19A11 11 0 0 1 19 30Z" stroke-linejoin="round"/>
    <circle cx="22.5" cy="41" r="4" fill="#4fd1c5" stroke="none"/>
    <circle cx="41.5" cy="41" r="4" fill="#4fd1c5" stroke="none"/>
    <path d="M24 24A11 11 0 0 1 40 24" stroke-linecap="round"/>
    <path d="M19 18A18 18 0 0 1 45 18" stroke-linecap="round" opacity=".55"/>
  </g>
  <text x="175" y="185" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#e6ebf2">DJI goggles</text>
  <text x="175" y="213" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#9aa3b2">Goggles 3 · O3 / O4 Pro</text>

  <!-- USB-C link -->
  <path d="M308 145H462" stroke="#4fd1c5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="385" y="130" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#4fd1c5">USB-C</text>
  <text x="385" y="172" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6b7585">H.264 video</text>

  <!-- Raspberry Pi 4 -->
  <rect x="475" y="50" width="250" height="190" rx="18" fill="#11151d" stroke="#4fd1c5" stroke-opacity=".6" stroke-width="2"/>
  <g transform="translate(548 70)">
    <rect x="0" y="0" width="104" height="70" rx="8" fill="#151a22" stroke="#4fd1c5" stroke-width="2.5"/>
    <rect x="34" y="18" width="36" height="34" rx="4" fill="#4fd1c5" fill-opacity=".18" stroke="#4fd1c5" stroke-width="2"/>
    <path d="M10 8H94" stroke="#4fd1c5" stroke-width="3" stroke-dasharray="3 4" stroke-opacity=".7"/>
    <rect x="-6" y="44" width="12" height="16" rx="2" fill="#4fd1c5" fill-opacity=".5"/>
    <rect x="98" y="44" width="12" height="16" rx="2" fill="#4fd1c5" fill-opacity=".5"/>
  </g>
  <text x="600" y="185" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#e6ebf2">Raspberry Pi 4</text>
  <text x="600" y="213" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#9aa3b2"><tspan fill="#4fd1c5">un</tspan>goggled · hardware decode</text>

  <!-- HDMI link -->
  <path d="M733 145H887" stroke="#4fd1c5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="810" y="130" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#4fd1c5">micro-HDMI</text>
  <text x="810" y="172" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6b7585">up to 1080p60</text>

  <!-- monitor -->
  <rect x="900" y="50" width="250" height="190" rx="18" fill="#11151d" stroke="#1f2733" stroke-width="2"/>
  <g transform="translate(965 66)">
    <rect x="0" y="0" width="120" height="74" rx="7" fill="#151a22" stroke="#4fd1c5" stroke-width="2.5"/>
    <path d="M12 58L42 30L62 46L80 34L108 58Z" fill="#4fd1c5" fill-opacity=".25"/>
    <path d="M48 74L44 88H76L72 74" stroke="#4fd1c5" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text x="1025" y="185" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#e6ebf2">HDMI screen</text>
  <text x="1025" y="213" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#9aa3b2">TV, monitor, capture card</text>

  <!-- phone / laptop on the Pi's Wi-Fi -->
  <path d="M600 296V252" stroke="#4fd1c5" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="380" y="300" width="440" height="74" rx="16" fill="#11151d" stroke="#1f2733" stroke-width="2"/>
  <g transform="translate(402 314)" stroke="#4fd1c5" stroke-width="2.5" stroke-linecap="round">
    <rect x="0" y="0" width="28" height="46" rx="6" fill="#4fd1c5" fill-opacity=".08"/>
    <path d="M10 39H18"/>
  </g>
  <text x="450" y="331" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#e6ebf2">Web console on your phone</text>
  <text x="450" y="357" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#9aa3b2">Wi-Fi <tspan fill="#4fd1c5">ungoggled</tspan> · http://192.168.50.1</text>
</svg>
