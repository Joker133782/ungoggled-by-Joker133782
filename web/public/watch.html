<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ungoggled – spectator stream</title>
<style>
  html, body { margin: 0; padding: 0; background: #11151b; color: #e8eef5; font-family: system-ui, sans-serif; height: 100%; }
  #video { display: block; width: 100%; max-height: 100vh; background: #000; }
  #message { padding: 16px; text-align: center; }
  #message.hidden { display: none; }
  button { font-size: 16px; padding: 10px 20px; border-radius: 8px; border: 1px solid #44505f; background: #1b222c; color: #e8eef5; }
</style>
</head>
<body>
<video id="video" controls autoplay muted playsinline></video>
<div id="message">
  <p>Connecting…</p>
  <p><button id="retry">Tap to play</button></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.2/dist/mpegts.js"></script>
<script>
const video = document.getElementById('video');
const message = document.getElementById('message');
const retry = document.getElementById('retry');
let player = null;

function setMessage(text) {
  message.classList.remove('hidden');
  message.querySelector('p').textContent = text;
}
function hideMessage() {
  message.classList.add('hidden');
}

function start() {
  if (!mpegts.getFeatureList().mseLivePlayback) {
    setMessage('This browser cannot play a live stream here. Try Chrome or Safari.');
    return;
  }
  if (player) {
    player.destroy();
    player = null;
  }
  player = mpegts.createPlayer(
    { type: 'mpegts', isLive: true, url: new URL('/api/stream.ts', location.href).href },
    { liveBufferLatencyChasing: true, enableWorker: true },
  );
  player.on(mpegts.Events.ERROR, () => {
    setMessage('Stream unavailable. It may be turned off, or the receiver is restarting.');
    setTimeout(start, 4000);
  });
  player.on(mpegts.Events.MEDIA_INFO, hideMessage);
  player.attachMediaElement(video);
  player.load();
  player.play().catch(() => setMessage('Tap below to start playback.'));
}
retry.addEventListener('click', () => {
  setMessage('Connecting…');
  video.play().catch(() => {});
  start();
});
start();
</script>
</body>
</html>
